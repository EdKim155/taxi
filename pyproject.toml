[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-bot"
version = "0.1.0"
description = "Telegram bot for generating taxi waybills"
readme = "README.md"
authors = [{name = "Taxi Bot Team"}]
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.1.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "gspread>=6.0.0",
    "google-auth>=2.22.0",
    "jinja2>=3.1.2",
    "weasyprint>=58.0",
    "pytz>=2023.3",
    "babel>=2.13",
]

[project.optional-dependencies]
dev = [
    "black>=23.9",
    "isort>=5.12",
    "pytest>=7.4",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
